<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4 - Mouse Events</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="scripts/main.js" defer></script>
</head>
<body>
    <header>
        <h1>Lab 4 - Mouse Events</h1>
        <p>A simple page to practice JavaScript events.</p>
    </header>

    <main>
        <section>
            <h2>1. Click - Counter</h2>
            <button id="countButton">Click me</button>
            <p>Counter: <span id="counter">0</span></p>
        </section>

        <section>
            <h2>2. Double click</h2>
            <p>Double-click the image to change its border.</p>
            <img id="photo" src="images/fotografia.png" alt="Illustration of a landscape">
        </section>

        <section>
            <h2>3. Mouse over and mouse out</h2>
            <div id="hoverArea">Move the mouse here</div>
        </section>

        <section>
            <h2>4. Mouse move</h2>
            <div id="moveArea">Move your mouse inside this box</div>
            <p id="position">X: 0 | Y: 0</p>
        </section>
    </main>

    <footer>
        <p>Lab 4 - DIW</p>
    </footer>
</body>
</html>
